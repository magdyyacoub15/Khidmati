name: manger
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^1.1.1
  url_launcher: ^6.3.2
  syncfusion_flutter_charts: ^31.2.3
  appwrite: ^14.0.0
  image_picker: ^1.2.0
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.2
  photo_view: ^0.15.0
  pdf: ^3.11.3
  printing: ^5.14.2
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1
  path: ^1.9.0
  flutter_web_auth_2: ^5.0.1
  flutter_native_splash: ^2.4.1   # شاشة البداية

  http: ^1.6.0
  workmanager: ^0.9.0+3
  cached_network_image: ^3.4.1
  image_cropper: ^11.0.0
  flutter_cache_manager: ^3.4.1
  video_player: ^2.10.1
  chewie: ^1.13.0
  dio: ^5.9.1
  universal_io: ^2.2.2
  device_info_plus: ^10.1.2
  crypto: ^3.0.7
  wakelock_plus: ^1.3.3
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  flutter_web_auth_2: ^5.0.1

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#ffffff"
    theme_color: "#0175C2"
  image_path: "assets/icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon.png"

flutter_native_splash:
  color: "#ffffff"            # لون الخلفية (ممكن تخليه ذهبي او ازرق)
  image: assets/icon.png      # صورة الأيقونة اللي هتظهر
  android: true
  ios: true
  fullscreen: false            # تخلي الصورة تكبر وتملى الشاشة

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Alfares.ttf
    - assets/icon.png
    - assets/images/magdi_yacoub.png
